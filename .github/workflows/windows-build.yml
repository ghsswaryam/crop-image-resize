name: Build Android APK

on:
  workflow_dispatch: # Allows you to trigger the build manually with a button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve Gradle Version Conflict & NDK
        run: |
          # 1. Update Gradle Wrapper to 8.14
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip" > android/gradle/wrapper/gradle-wrapper.properties

          # 2. Ensure settings.gradle.kts has the correct versions (8.11.1 & 2.2.20)
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "8.11.1"/g' android/settings.gradle.kts
            sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' android/settings.gradle.kts
          fi

          # 3. Completely remove conflicting plugins block from android/build.gradle.kts if it exists
          if [ -f "android/build.gradle.kts" ]; then
            # Clear or comment out the plugins block to prevent classpath conflict
            sed -i '/plugins {/,/}/d' android/build.gradle.kts
          fi

          # 4. Add ndkVersion safely to android/app/build.gradle.kts
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/ndkVersion/d' android/app/build.gradle.kts
            sed -i '/defaultConfig {/a \    ndkVersion = "28.2.13676358"' android/app/build.gradle.kts
          fi

      - name: Build Android APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
