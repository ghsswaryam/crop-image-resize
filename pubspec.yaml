name: multiimagecroptool
description: "طلبہ کی پاسپورٹ سائز تصاویر کراپ، ریسائز اور گرڈ بنانے کی ایپ - غلام شبیر"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  image: ^4.3.0
  image_cropper: ^8.0.2
  provider: ^6.1.2
  archive: ^4.0.9
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  audioplayers: ^6.0.0
  permission_handler: ^11.3.0
  flutter_image_compress: ^2.3.0
  flutter_file_dialog: ^3.0.3
  
  # Updated Firebase Packages to fix CMake/GitHub Actions error
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.8.0
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.5.0
  
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  google_mobile_ads: ^5.2.0
  marquee: ^2.2.3 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700
  assets:
    - assets/images/ic_launcher.png
    - assets/images/google.png
    - assets/click.mp3

flutter_launcher_icons:
  image_path: "assets/images/ic_launcher.png"
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21
